name: PS2 Bootstrap CI

on:
  push:
    branches: [ "ps2" ]
    paths:
      - "port/ps2/**"
      - "port/fast3d/**"
      - "port/src/**"
      - "port/include/**"
      - "src/assets/**"
      - "src/include/**"
      - "include/**"
      - "tools/assetmgr/**"
      - ".github/workflows/ps2-bootstrap.yml"
  pull_request:
    branches: [ "ps2" ]
    paths:
      - "port/ps2/**"
      - "port/fast3d/**"
      - "port/src/**"
      - "port/include/**"
      - "src/assets/**"
      - "src/include/**"
      - "include/**"
      - "tools/assetmgr/**"
      - ".github/workflows/ps2-bootstrap.yml"
  workflow_dispatch:

jobs:
  ee-bootstrap:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest
      options: --user 0
    timeout-minutes: 15

    steps:
      - name: Install host-side build tools
        run: apk add --no-cache bash cmake g++ git ninja python3 zlib-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record current toolchain
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          mips64r5900el-ps2-elf-gcc --version
          mips64r5900el-ps2-elf-ld --version | head -n 1
          g++ --version | head -n 1
          cmake --version | head -n 1
          ninja --version
          python3 --version
          sha256sum port/ps2/ps2dev-toolchain.cmake

      - name: Test backend-independent RDP TMEM model
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d \
            port/fast3d/tests/gfx_primitive_depth_test.cpp \
            -o /tmp/gfx_primitive_depth_test
          /tmp/gfx_primitive_depth_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d \
            port/fast3d/rdp_tmem.cpp \
            port/fast3d/rdp_tmem_runtime.cpp \
            port/fast3d/tests/rdp_tmem_test.cpp \
            -o /tmp/rdp_tmem_test
          /tmp/rdp_tmem_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d \
            port/fast3d/rdp_tmem.cpp \
            port/fast3d/rdp_tmem_runtime.cpp \
            port/fast3d/rdp_tmem_live.cpp \
            port/fast3d/tests/rdp_tmem_live_test.cpp \
            -o /tmp/rdp_tmem_live_test
          /tmp/rdp_tmem_live_test

      - name: Test GS command budget and VRAM allocator
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_command_budget.cpp \
            port/ps2/gs_command_budget_test.cpp \
            -o /tmp/gs_command_budget_test
          /tmp/gs_command_budget_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_vram_allocator.cpp \
            port/ps2/gs_vram_allocator_test.cpp \
            -o /tmp/gs_vram_allocator_test
          /tmp/gs_vram_allocator_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_render_target_layout.cpp \
            port/ps2/gs_render_target_layout_test.cpp \
            -o /tmp/gs_render_target_layout_test
          /tmp/gs_render_target_layout_test

      - name: Test native GS texture conversion
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_texture_convert.cpp \
            port/ps2/gs_texture_convert_test.cpp \
            -o /tmp/gs_texture_convert_test
          /tmp/gs_texture_convert_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d -Iport/ps2 \
            port/ps2/gfx_ps2_texture_variant_test.cpp \
            -o /tmp/gfx_ps2_texture_variant_test
          /tmp/gfx_ps2_texture_variant_test

      - name: Test native PS2 game input mapping
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -D_LANGUAGE_C=1 -DPLATFORM_PS2=1 \
            -Iport/ps2 -Iport/include -Iinclude -Iinclude/PR -Isrc/include \
            port/ps2/input_ps2_map.c \
            port/ps2/input_ps2_map_test.c \
            -o /tmp/input_ps2_map_test
          /tmp/input_ps2_map_test

          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -D_LANGUAGE_C=1 -DPLATFORM_PS2=1 \
            -Iport/ps2 -Iport/include -Iinclude -Iinclude/PR -Isrc/include \
            port/ps2/input_ps2.c \
            port/ps2/input_ps2_map.c

      - name: Test bounded ROM source and RZIP streaming
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -D_LANGUAGE_C=1 \
            -Iport/include -Iinclude -Iinclude/PR \
            port/src/romsource.c \
            port/ps2/romsource_test.c \
            -lz \
            -o /tmp/romsource_test
          /tmp/romsource_test

      - name: Test bounded PS2 audio submit policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/audio_ps2_queue.c \
            port/ps2/audio_ps2_queue_test.c \
            -o /tmp/audio_ps2_queue_test
          /tmp/audio_ps2_queue_test

      - name: Test PS2 combiner planner
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d -Iport/ps2 \
            port/fast3d/gfx_cc.cpp \
            port/ps2/gfx_ps2_combiner.cpp \
            port/ps2/gfx_ps2_combiner_test.cpp \
            -o /tmp/gfx_ps2_combiner_test
          /tmp/gfx_ps2_combiner_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gfx_ps2_pass_graph.cpp \
            port/ps2/gfx_ps2_pass_graph_test.cpp \
            -o /tmp/gfx_ps2_pass_graph_test
          /tmp/gfx_ps2_pass_graph_test

          g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only \
            -D_LANGUAGE_C_PLUS_PLUS=1 \
            -include include/PR/ultratypes.h \
            -Iport/ps2 -Iport/fast3d -Iport/include \
            -Iinclude -Iinclude/PR -Isrc/include -Isrc/lib/ultra/audio \
            port/ps2/gfx_ps2.cpp \
            port/ps2/gfx_ps2_combiner.cpp \
            port/ps2/gfx_ps2_pass_graph.cpp

          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -DPERFECT_DARK_PS2_ALPHA_TRILERP_DIAGNOSTIC=1 \
            -D_LANGUAGE_C=1 \
            -include include/PR/ultratypes.h \
            -Iport/ps2 -Iport/fast3d -Iport/include \
            -Iinclude -Iinclude/PR -Isrc/include -Isrc/lib/ultra/audio \
            port/ps2/gfx_api_scene.c

      - name: Configure PS2 bootstrap
        run: |
          cmake -S port/ps2 -B build-ps2 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/port/ps2/ps2dev-toolchain.cmake"

      - name: Build PS2 bootstrap
        run: cmake --build build-ps2 -j2 --verbose

      - name: Inspect EE ELF
        run: |
          test -f build-ps2/pd-ps2-bootstrap.elf
          mips64r5900el-ps2-elf-size build-ps2/pd-ps2-bootstrap.elf
          mips64r5900el-ps2-elf-readelf -h build-ps2/pd-ps2-bootstrap.elf
          mips64r5900el-ps2-elf-nm build-ps2/pd-ps2-bootstrap.elf | \
            grep -E ' audioInit$| audsrv_irx$| size_audsrv_irx$'
          mips64r5900el-ps2-elf-nm -n build-ps2/pd-ps2-bootstrap.elf | tail -n 20

      - name: Build alpha-trilerp hardware diagnostic
        run: |
          cmake -S port/ps2 -B build-ps2-alpha-diag -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/port/ps2/ps2dev-toolchain.cmake" \
            -DPD_PS2_ALPHA_TRILERP_DIAGNOSTIC=ON
          cmake --build build-ps2-alpha-diag -j2 --verbose
          test -f build-ps2-alpha-diag/pd-ps2-alpha-trilerp-diag.elf
          mips64r5900el-ps2-elf-size \
            build-ps2-alpha-diag/pd-ps2-alpha-trilerp-diag.elf

      - name: Upload bootstrap ELF
        uses: actions/upload-artifact@v4
        with:
          name: pd-ps2-bootstrap
          path: build-ps2/pd-ps2-bootstrap.elf
          if-no-files-found: error
          retention-days: 14

      - name: Upload alpha-trilerp diagnostic ELF
        uses: actions/upload-artifact@v4
        with:
          name: pd-ps2-alpha-trilerp-diag
          path: build-ps2-alpha-diag/pd-ps2-alpha-trilerp-diag.elf
          if-no-files-found: error
          retention-days: 14
