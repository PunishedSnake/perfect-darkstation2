name: PS2 CI

on:
  push:
    branches: [ "ps2" ]
    paths:
      - "port/ps2/**"
      - "port/fast3d/**"
      - "port/src/**"
      - "port/include/**"
      - "src/game/**"
      - "src/lib/**"
      - "src/textureconfig.c"
      - "src/assets/**"
      - "src/include/**"
      - "include/**"
      - "tools/assetmgr/**"
      - ".github/workflows/ps2-ci.yml"
  pull_request:
    branches: [ "ps2" ]
    paths:
      - "port/ps2/**"
      - "port/fast3d/**"
      - "port/src/**"
      - "port/include/**"
      - "src/game/**"
      - "src/lib/**"
      - "src/textureconfig.c"
      - "src/assets/**"
      - "src/include/**"
      - "include/**"
      - "tools/assetmgr/**"
      - ".github/workflows/ps2-ci.yml"
  workflow_dispatch:
    inputs:
      build_o2:
        description: "Build and publish the optimized O2 comparison ELF"
        required: false
        default: false
        type: boolean

concurrency:
  group: ps2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps2-build-and-test:
    name: Build and test PS2 port
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2dev:latest
      options: --user 0
    timeout-minutes: 15

    steps:
      - name: Install host-side build tools
        run: apk add --no-cache bash cmake g++ git ninja python3 zlib-dev

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Record current toolchain
        run: |
          {
            echo "repository_sha=$GITHUB_SHA"
            echo "repository_ref=$GITHUB_REF"
            echo "default_profile=Og"
            echo "optional_comparison_profile=O2"
            echo "ps2dev=$PS2DEV"
            echo "ps2sdk=$PS2SDK"
            echo "gskit=$GSKIT"
            printf "ps2sdk_commit="
            git -C "$PS2SDK" rev-parse HEAD 2>/dev/null || echo "unavailable-in-container"
            printf "gskit_commit="
            git -C "$GSKIT" rev-parse HEAD 2>/dev/null || echo "unavailable-in-container"
            mips64r5900el-ps2-elf-gcc --version | head -n 1
            mips64r5900el-ps2-elf-ld --version | head -n 1
            g++ --version | head -n 1
            cmake --version | head -n 1
            printf "ninja="
            ninja --version
            printf "python="
            python3 --version
            sha256sum port/ps2/ps2dev-toolchain.cmake
          } | tee ps2-build-metadata.txt

      - name: Test backend-independent RDP TMEM model
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d \
            port/fast3d/tests/gfx_primitive_depth_test.cpp \
            -o /tmp/gfx_primitive_depth_test
          /tmp/gfx_primitive_depth_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d \
            port/fast3d/rdp_tmem.cpp \
            port/fast3d/rdp_tmem_runtime.cpp \
            port/fast3d/tests/rdp_tmem_test.cpp \
            -o /tmp/rdp_tmem_test
          /tmp/rdp_tmem_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d \
            port/fast3d/rdp_tmem.cpp \
            port/fast3d/rdp_tmem_runtime.cpp \
            port/fast3d/rdp_tmem_live.cpp \
            port/fast3d/tests/rdp_tmem_live_test.cpp \
            -o /tmp/rdp_tmem_live_test
          /tmp/rdp_tmem_live_test

      - name: Test GS command budget and VRAM allocator
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_clip.cpp \
            port/ps2/gs_clip_test.cpp \
            -o /tmp/gs_clip_test
          /tmp/gs_clip_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 port/ps2/gs_dma_policy_test.cpp \
            -o /tmp/gs_dma_policy_test
          /tmp/gs_dma_policy_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 port/ps2/memory_budget_test.cpp \
            -o /tmp/memory_budget_test
          /tmp/memory_budget_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_vu1_wait.cpp \
            port/ps2/gs_vu1_wait_test.cpp \
            -o /tmp/gs_vu1_wait_test
          /tmp/gs_vu1_wait_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_alpha_equation.cpp \
            port/ps2/gs_alpha_equation_test.cpp \
            -o /tmp/gs_alpha_equation_test
          /tmp/gs_alpha_equation_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_frame_mask.cpp \
            port/ps2/gs_frame_mask_test.cpp \
            -o /tmp/gs_frame_mask_test
          /tmp/gs_frame_mask_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_command_budget.cpp \
            port/ps2/gs_command_budget_test.cpp \
            -o /tmp/gs_command_budget_test
          /tmp/gs_command_budget_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_state_shadow.cpp \
            port/ps2/gs_state_shadow_test.cpp \
            -o /tmp/gs_state_shadow_test
          /tmp/gs_state_shadow_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_vram_allocator.cpp \
            port/ps2/gs_vram_allocator_test.cpp \
            -o /tmp/gs_vram_allocator_test
          /tmp/gs_vram_allocator_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_render_target_layout.cpp \
            port/ps2/gs_render_target_layout_test.cpp \
            -o /tmp/gs_render_target_layout_test
          /tmp/gs_render_target_layout_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_vu1_batch.cpp \
            port/ps2/gs_vu1_batch_test.cpp \
            -o /tmp/gs_vu1_batch_test
          /tmp/gs_vu1_batch_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_vu1_transform.cpp \
            port/ps2/gs_vu1_transform_test.cpp \
            -o /tmp/gs_vu1_transform_test
          /tmp/gs_vu1_transform_test

          g++ -std=c++20 -Wall -Wextra -Werror -shared -fPIC \
            -Iport/ps2 port/ps2/gs_vu1_transform.cpp \
            -o /tmp/gs_vu1_transform.so
          python3 port/ps2/gs_vu1_microprogram_test.py \
            /tmp/gs_vu1_transform.so

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/ps2_renderer_stats.cpp \
            port/ps2/ps2_renderer_stats_test.cpp \
            -o /tmp/ps2_renderer_stats_test
          /tmp/ps2_renderer_stats_test

      - name: Test native GS texture conversion
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gs_texture_convert.cpp \
            port/ps2/gs_texture_convert_test.cpp \
            -o /tmp/gs_texture_convert_test
          /tmp/gs_texture_convert_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d -Iport/ps2 \
            port/ps2/gfx_ps2_texture_variant_test.cpp \
            -o /tmp/gfx_ps2_texture_variant_test
          /tmp/gfx_ps2_texture_variant_test

      - name: Test native PS2 game input mapping
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/log_checkpoint_policy_test.c \
            -o /tmp/log_checkpoint_policy_test
          /tmp/log_checkpoint_policy_test

          gcc -std=c11 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/pad_axis_ps2.c \
            port/ps2/pad_axis_ps2_test.c \
            -o /tmp/pad_axis_ps2_test
          /tmp/pad_axis_ps2_test

          gcc -std=c11 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/path_ps2_test.c \
            -o /tmp/path_ps2_test
          /tmp/path_ps2_test

          gcc -std=c11 -Wall -Wextra -Werror \
            -D_LANGUAGE_C=1 -DPLATFORM_PS2=1 \
            -Iport/ps2 -Iport/include -Iinclude -Iinclude/PR -Isrc/include \
            port/ps2/input_ps2_map.c \
            port/ps2/input_ps2_map_test.c \
            -o /tmp/input_ps2_map_test
          /tmp/input_ps2_map_test

          gcc -std=c11 -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-unused-value -Wno-empty-body \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -D_LANGUAGE_C=1 -DPLATFORM_PS2=1 \
            -Iport/ps2 -Iport/include -Iinclude -Iinclude/PR -Isrc/include \
            port/src/libultra.c port/ps2/vi_black_state_test.c \
            -o /tmp/vi_black_state_test
          /tmp/vi_black_state_test

          gcc -std=c11 -Wall -Wextra -Werror \
            -Iport/include -Iinclude -Iinclude/PR \
            port/ps2/vi_unblack_timer_test.c \
            -o /tmp/vi_unblack_timer_test
          /tmp/vi_unblack_timer_test

          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -D_LANGUAGE_C=1 -DPLATFORM_PS2=1 \
            -Iport/ps2 -Iport/include -Iinclude -Iinclude/PR -Isrc/include \
            port/ps2/input_ps2.c \
            port/ps2/input_ps2_map.c

      - name: Test bounded ROM source and RZIP streaming
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -D_LANGUAGE_C=1 \
            -Iport/include -Iinclude -Iinclude/PR -Isrc/include -Isrc/lib/ultra/audio \
            src/lib/rzip_c.c \
            port/ps2/rzip_bounded_test.c \
            -lz \
            -o /tmp/rzip_bounded_test
          /tmp/rzip_bounded_test

          gcc -std=c11 -Wall -Wextra -Werror \
            -Iport/include \
            port/ps2/romdata_policy_test.c \
            -o /tmp/romdata_policy_test
          /tmp/romdata_policy_test

          gcc -std=c11 -Wall -Wextra -Werror \
            -D_LANGUAGE_C=1 \
            -Iport/include -Iinclude -Iinclude/PR \
            port/src/romsource.c \
            port/ps2/romsource_test.c \
            -lz \
            -o /tmp/romsource_test
          /tmp/romsource_test

      - name: Test bounded PS2 audio submit policy
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/audio_ps2_queue.c \
            port/ps2/audio_ps2_queue_test.c \
            -o /tmp/audio_ps2_queue_test
          /tmp/audio_ps2_queue_test

      - name: Test PS2 combiner planner
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/fast3d -Iport/ps2 \
            port/fast3d/gfx_cc.cpp \
            port/ps2/gfx_ps2_combiner.cpp \
            port/ps2/gfx_ps2_combiner_test.cpp \
            -o /tmp/gfx_ps2_combiner_test
          /tmp/gfx_ps2_combiner_test

      - name: Test PS2 pass graph
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iport/ps2 \
            port/ps2/gfx_ps2_pass_graph.cpp \
            port/ps2/gfx_ps2_pass_graph_test.cpp \
            -o /tmp/gfx_ps2_pass_graph_test
          /tmp/gfx_ps2_pass_graph_test

      - name: Host syntax-check PS2 renderer
        run: |
          timeout 45s g++ -std=c++20 -Wall -Wextra -Werror \
            -fdiagnostics-color=never -fmax-errors=20 -fsyntax-only \
            -D_LANGUAGE_C_PLUS_PLUS=1 \
            -include include/PR/ultratypes.h \
            -Iport/ps2 -Iport/fast3d -Iport/include \
            -Iinclude -Iinclude/PR -Isrc/include -Isrc/lib/ultra/audio \
            port/ps2/gfx_ps2.cpp

      - name: Host syntax-check alpha-trilerp scene
        run: |
          timeout 45s gcc -std=c11 -Wall -Wextra -Werror \
            -fdiagnostics-color=never -fmax-errors=20 -fsyntax-only \
            -DPERFECT_DARK_PS2_ALPHA_TRILERP_DIAGNOSTIC=1 \
            -D_LANGUAGE_C=1 \
            -include include/PR/ultratypes.h \
            -Iport/ps2 -Iport/fast3d -Iport/include \
            -Iinclude -Iinclude/PR -Isrc/include -Isrc/lib/ultra/audio \
            port/ps2/gfx_api_scene.c

      - name: Host syntax-check VU1 scene
        run: |
          timeout 45s gcc -std=c11 -Wall -Wextra -Werror \
            -fdiagnostics-color=never -fmax-errors=20 -fsyntax-only \
            -DPERFECT_DARK_PS2_VU1_COLOR_BATCH=1 \
            -D_LANGUAGE_C=1 \
            -include include/PR/ultratypes.h \
            -Iport/ps2 -Iport/fast3d -Iport/include \
            -Iinclude -Iinclude/PR -Isrc/include -Isrc/lib/ultra/audio \
            port/ps2/gfx_api_scene.c

      - name: Test renderer trace format and decoder
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -D_LANGUAGE_C_PLUS_PLUS=1 \
            -include include/PR/ultratypes.h \
            -Iport/ps2 -Iport/include -Iinclude -Iinclude/PR \
            port/ps2/renderer_trace.cpp \
            port/ps2/renderer_trace_test.cpp \
            -o /tmp/renderer_trace_test
          /tmp/renderer_trace_test
          python3 tools/ps2_renderer_trace_decode.py \
            /tmp/pdps2-gs-trace.bin \
            --json /tmp/pdps2-gs-trace.json \
            --extract-screenshot /tmp/pdps2-frame.png
          python3 - <<'PY'
          import json
          from pathlib import Path

          with open("/tmp/pdps2-gs-trace.json", encoding="utf-8") as stream:
              trace = json.load(stream)
          assert trace["analysis"]["paths"]["path1"]["submits"] == 1
          assert trace["analysis"]["paths"]["path3"]["submits"] == 1
          assert "by_pass_graph" in trace["analysis"]
          shot = trace["analysis"]["screenshot"]
          assert shot["success"] is True
          assert shot["hash_ok"] is True
          assert shot["width"] == 2 and shot["height"] == 2
          assert Path("/tmp/pdps2-frame.png").read_bytes().startswith(
              b"\x89PNG\r\n\x1a\n")
          PY

      - name: Test VU1 fog diagnostic VBO
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -DPERFECT_DARK_PS2_VU1_COLOR_BATCH=1 -D_LANGUAGE_C=1 \
            -include include/PR/ultratypes.h \
            -Iport/ps2 -Iport/fast3d -Iport/include \
            -Iinclude -Iinclude/PR -Isrc/include -Isrc/lib/ultra/audio \
            port/ps2/gfx_api_scene_vu1_test.c \
            -o /tmp/gfx_api_scene_vu1_test
          /tmp/gfx_api_scene_vu1_test

      - name: Configure PS2 bootstrap
        run: |
          cmake -S port/ps2 -B build-ps2 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/port/ps2/ps2dev-toolchain.cmake"

      - name: Test game frame arena bounds
        run: |
          cmake --build build-ps2 --target pd_ps2_asset_headers -j2
          gcc -std=c11 -Wall -Wextra -Werror \
            -Wno-unused-variable -Wno-sign-compare \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -DPLATFORM_PS2=1 -D_LANGUAGE_C=1 -DMATCHING=0 \
            -DPAL=0 -DVERSION=2 \
            -Iport/ps2 -Iport/include -Iinclude -Iinclude/PR \
            -Isrc/include -Isrc/lib/ultra/audio -Isrc/generated/ntsc-final \
            src/game/gfxmemory.c port/ps2/gfxmemory_bounds_test.c \
            -o /tmp/gfxmemory_bounds_test
          /tmp/gfxmemory_bounds_test

      - name: Build PS2 bootstrap
        run: cmake --build build-ps2 -j2 --verbose

      - name: Build full Perfect Dark PS2 runtime
        run: cmake --build build-ps2 --target pd_ps2_game -j2 --verbose

      - name: Inspect EE ELF
        run: |
          test -f build-ps2/pd-ps2-bootstrap.elf
          mips64r5900el-ps2-elf-size build-ps2/pd-ps2-bootstrap.elf
          mips64r5900el-ps2-elf-readelf -h build-ps2/pd-ps2-bootstrap.elf
          mips64r5900el-ps2-elf-nm build-ps2/pd-ps2-bootstrap.elf | \
            grep -E ' audioInit$| audsrv_irx$| size_audsrv_irx$'
          mips64r5900el-ps2-elf-nm -n build-ps2/pd-ps2-bootstrap.elf | tail -n 20

      - name: Inspect full game EE ELF
        run: |
          test -f build-ps2/pd-ps2-game.elf
          test -s build-ps2/pd-ps2-game.map
          mips64r5900el-ps2-elf-size build-ps2/pd-ps2-game.elf
          mips64r5900el-ps2-elf-readelf -h build-ps2/pd-ps2-game.elf
          mips64r5900el-ps2-elf-nm build-ps2/pd-ps2-game.elf | \
            grep -E ' main$| mainProc$| videoInit$| gfx_run$| sqrtf$| Ps2GsVu1TexturedTransformCode(Start|End)$'
          mips64r5900el-ps2-elf-objdump -d --disassemble=sqrtf \
            build-ps2/pd-ps2-game.elf | grep -E '\bsqrt\.s\b'
          test -z "$(mips64r5900el-ps2-elf-nm -u build-ps2/pd-ps2-game.elf)"
          mips64r5900el-ps2-elf-size -A build-ps2/pd-ps2-game.elf > \
            build-ps2/pd-ps2-game.sections.txt

      - name: Reject dynamic STL containers in PS2 runtime
        run: |
          if grep -Eq 'libstdc\+\+\.a\((list|tree|hashtable|functexcept|eh_|bad_alloc)' \
              build-ps2/pd-ps2-game.map; then
            echo "PS2 runtime pulled dynamic STL container/exception support:" >&2
            grep -E 'libstdc\+\+\.a\((list|tree|hashtable|functexcept|eh_|bad_alloc)' \
              build-ps2/pd-ps2-game.map | sort -u >&2
            exit 1
          fi

      - name: Build optimized full game A/B
        if: github.event_name == 'workflow_dispatch' && inputs.build_o2
        run: |
          cmake -S port/ps2 -B build-ps2-o2 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/port/ps2/ps2dev-toolchain.cmake" \
            -DPD_PS2_OPTIMIZATION=O2
          cmake --build build-ps2-o2 --target pd_ps2_game -j2 --verbose
          test -f build-ps2-o2/pd-ps2-game.elf
          test -s build-ps2-o2/pd-ps2-game.map
          mips64r5900el-ps2-elf-size build-ps2-o2/pd-ps2-game.elf
          test -z "$(mips64r5900el-ps2-elf-nm -u build-ps2-o2/pd-ps2-game.elf)"
          mips64r5900el-ps2-elf-size -A build-ps2-o2/pd-ps2-game.elf > \
            build-ps2-o2/pd-ps2-game.sections.txt

      - name: Upload full game ELF
        uses: actions/upload-artifact@v7
        with:
          name: pd-ps2-game
          path: |
            build-ps2/pd-ps2-game.elf
            build-ps2/pd-ps2-game.map
            build-ps2/pd-ps2-game.sections.txt
            ps2-build-metadata.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload optimized full game A/B
        if: github.event_name == 'workflow_dispatch' && inputs.build_o2
        uses: actions/upload-artifact@v7
        with:
          name: pd-ps2-game-o2
          path: |
            build-ps2-o2/pd-ps2-game.elf
            build-ps2-o2/pd-ps2-game.map
            build-ps2-o2/pd-ps2-game.sections.txt
            ps2-build-metadata.txt
          if-no-files-found: error
          retention-days: 3

  prune-old-ps2-artifacts:
    name: Prune superseded PS2 artifacts
    needs: ps2-build-and-test
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Keep only artifacts from the current successful PS2 run
        uses: actions/github-script@v9
        with:
          script: |
            const currentRunId = Number(context.runId);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            const staleArtifacts = artifacts.filter((artifact) =>
              !artifact.expired &&
              artifact.workflow_run?.head_branch === 'ps2' &&
              artifact.workflow_run?.id !== currentRunId
            );

            core.info(`Deleting ${staleArtifacts.length} superseded PS2 artifact(s).`);

            for (const artifact of staleArtifacts) {
              core.info(`Deleting ${artifact.name} (${artifact.id}).`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
